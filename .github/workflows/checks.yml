# The doctrine's retired-name check, run against this repository's own
# tracked text files, with build-doctrine checked out at a pinned commit.
name: checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tltaylor1/build-doctrine
          ref: 3a9e72d874aae4244836e3f877458c639f4faf6e
          path: doctrine
          persist-credentials: false
      - name: no retired project name in active text
        run: python3 doctrine/scripts/check_names.py .
